<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         let day = Number(prompt("What Day Is It Today?"));
        switch (day) {
            case 1: alert ("Monday: Sleep Early Day"); break;
            case 2: alert ("Tuesday: Grieve a full school Day"); break;
            case 3: alert ("Wednesday: Enjoy middle of the week Day"); break;
            case 4: alert ("Thursday: Almost Friday Day"); break;
            case 5: alert ("Friday: Happiest Day Of The Week"); break;
            case 6: alert ("Saturday: Chud Day"); 
            case 6: case 7: alert("It's the weekend!!!"); break;
            case 7: alert ("Sunday: Another Sleep Day"); 
            default:alert ("Invalid Day") 
        }
        </script>
</body>
</html>
