<!DOCTYPE html>

<body>
    <script>
        let grade = Number(prompt("What Grade Did You Recieve?"));
        if (grade >= 90) {
            alert("A");
        }
        else if (grade >= 80) {
            alert("B")
        }
         else if (grade >= 70) {
            alert("C")
        }else if (grade >= 60) {
            alert("D")
        }else if (grade <= 60) {
            alert("F")
        }
//* You use number with the prompt because if not, the humber will turn into a string.//*

 /*

  89         | B        | _B__
  60         | D        | _D__
  59         | F        | _F__
  100        | A        | _A__
*/
    </script>
</body>
</html>
