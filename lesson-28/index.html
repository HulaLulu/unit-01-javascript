<!DOCTYPE html>
<html>
<head>
  <title>Pizza Order</title>
</head>
<body>
  <h1>Pizza Order</h1>
  <form name="order">
    <p>Name: <input type="text" id="custName"> <span id="nameError"></span></p>
    <p>Quantity: <input type="text" id="qty"> <span id="qtyError"></span></p>
    <p>Promo code: <input type="text" id="promo"> <span id="promoError"></span></p>
    <p>Phone: <input type="text" id="phone"> <span id="phoneError"></span></p>
    <button type="button" id="orderBtn">Place order</button>
  </form>
  <p id="orderStatus"></p>
  <script>
    let custName = document.getElementById("custName");
    let qty = document.getElementById("qty");
    let promo = document.getElementById("promo");
    let phone = document.getElementById("phone");

    // Write your code below
   function showError(id, message) {
    let box = document.getElementById(id);
    box.textContent = message;
    box.style.color = "red";
   }

   function checkName() {
    if (custName.value.trim()=== "") {
      showError("nameError", "Enter your name")
      return false;
    }
    else {
        showError("nameError", ""
            return true;
        )
    }
   }

   function checkQty() {
    if (qty.value.trim()=== "") {
       showError("qtyError", "Enter a Quantity.")
       return false;
    }
    if (isNaN(qty.value)) {
        showError("qtyError", "Quantity must be a number.");
        return false;
    }
    if (qty.value < 1 || qty.value > 10) {
        showError("qtyError", "Order 1 to 10 pizzas only.");
            return false;

    }
}





custName.addEventListener("blur", checkName);
qty.addEventListener("blur", checkQty);
promo.addEventlistener("blur", checkPromo)

  </script>
</body>
</html>
